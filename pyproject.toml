[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rechuckit"
version = "0.1.0"
description = "Audio-guided MIDI reconstruction engine for DAW-ready exports"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
